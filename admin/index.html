<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Menu admin</title>
  <link rel="icon" href="../images/brand/favicon-32.png" type="image/png">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="admin.css">
  <script type="module" src="admin.js"></script>
</head>
<body class="admin">
  <header class="admin-bar">
    <div class="container admin-bar__inner">
      <h1 class="admin-bar__title"><span id="site-name" dir="auto"></span> · <span data-t="title">Menu admin</span></h1>
      <div class="admin-bar__actions">
        <span class="admin-status" id="status" role="status" aria-live="polite"></span>
        <a class="btn" href="../" target="_blank" rel="noopener" data-t="viewSite">View site</a>
        <button class="btn" id="logout" type="button" hidden data-t="logout">Log out</button>
        <button class="btn btn--primary" id="save" type="button" disabled data-t="save">Save changes</button>
      </div>
    </div>
  </header>

  <main class="container admin-main" id="login-view" hidden>
    <section class="panel login" aria-labelledby="login-title">
      <h2 id="login-title" class="panel__title" data-t="loginTitle">Log in</h2>
      <p class="login__notice" id="login-notice" hidden></p>
      <form class="login__form" id="login-form">
        <label><span data-t="password">Password</span><input name="password" type="password" autocomplete="current-password" required dir="ltr"></label>
        <button class="btn btn--primary" type="submit" data-t="login">Log in</button>
      </form>
    </section>
  </main>

  <main class="container admin-main" id="app" hidden>
    <p class="admin-note" id="price-note"></p>
    <p class="admin-note" id="image-note"></p>

    <nav id="tabs-nav"><ul class="admin-tabs" id="tabs"></ul></nav>

    <section class="panel" aria-labelledby="add-title">
      <h2 id="add-title" class="panel__title"></h2>
      <form class="add-form" id="add-form" autocomplete="off">
        <label><span data-t="name">Name</span><input name="name" required></label>
        <label><span data-t="nameAlt">Second name (optional)</span><input name="nameAlt"></label>
        <label><span id="add-price-label"></span><input name="price" type="number" min="0" step="any" inputmode="decimal" dir="ltr"></label>
        <button class="btn btn--primary" type="submit" data-t="add">Add</button>
      </form>
    </section>

    <section aria-labelledby="items-title">
      <h2 id="items-title" class="panel__title"><span data-t="items">Items</span> <span class="count" id="count"></span></h2>
      <ul class="items" id="items"></ul>
    </section>
  </main>
  <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
</body>
</html>
